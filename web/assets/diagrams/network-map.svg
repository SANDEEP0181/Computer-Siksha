<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">Simple computer network</title><desc id="d">Devices connect through a router to the internet</desc><rect width="900" height="280" rx="24" fill="#eaf5ed"/><g stroke="#27824b" stroke-width="5" fill="none"><path d="M450 130 L175 65 M450 130 L175 220 M450 130 L725 65 M450 130 L725 220 M450 130 L450 35"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="350" y="95" width="200" height="85" rx="18" fill="#176b3a"/><text x="450" y="130" fill="#fff" font-size="23" font-weight="700">ROUTER</text><text x="450" y="155" fill="#e5f5e9" font-size="16">Connects devices</text><g fill="#fff" stroke="#b9d8c1" stroke-width="3"><rect x="90" y="30" width="170" height="65" rx="12"/><rect x="90" y="190" width="170" height="65" rx="12"/><rect x="640" y="30" width="170" height="65" rx="12"/><rect x="640" y="190" width="170" height="65" rx="12"/><rect x="365" y="8" width="170" height="50" rx="12"/></g><g fill="#176b3a" font-size="18" font-weight="700"><text x="175" y="70">LAPTOP</text><text x="175" y="230">PHONE</text><text x="725" y="70">PRINTER</text><text x="725" y="230">DESKTOP</text><text x="450" y="40">INTERNET</text></g></g></svg>