name: Content validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lesson and quiz content
        run: node scripts/validate-content.js
