name: Validate Computer Siksha bilingual course
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/app/src/main/assets/**"
      - "scripts/validate-course.js"
      - ".github/workflows/validate-course.yml"
  pull_request:
    paths:
      - "web/**"
      - "android/app/src/main/assets/**"
      - "scripts/validate-course.js"
      - ".github/workflows/validate-course.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate English and Hindi course content
        run: node scripts/validate-course.js
